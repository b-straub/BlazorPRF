name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create local NuGet folder
        run: mkdir -p .nuget

      # Install all npm dependencies
      - name: Install npm dependencies (Crypto)
        working-directory: BlazorPRF.Crypto/TypeScript
        run: npm install

      - name: Install npm dependencies (Wasm.Crypto)
        working-directory: BaseCrypto/BlazorPRF.Wasm.Crypto/TypeScript
        run: npm install

      # Build TypeScript BEFORE any dotnet commands (MSBuild discovers static web assets at evaluation time)
      - name: Build TypeScript (Crypto)
        working-directory: BlazorPRF.Crypto/TypeScript
        run: npm run build:release

      - name: Build TypeScript (Wasm.Crypto)
        working-directory: BaseCrypto/BlazorPRF.Wasm.Crypto/TypeScript
        run: npm run build:release

      - name: Verify wwwroot folders exist
        run: |
          ls -la BlazorPRF.Crypto/wwwroot/
          ls -la BaseCrypto/BlazorPRF.Wasm.Crypto/wwwroot/

      # Build crypto packages (GeneratePackageOnBuild=true is default for Release)
      - name: Build Crypto.Abstractions
        run: dotnet build BlazorPRF.Crypto.Abstractions/BlazorPRF.Crypto.Abstractions.csproj -c Release -p:BlazorPRFVersion=${{ steps.version.outputs.VERSION }}

      - name: Build Crypto
        run: dotnet build BlazorPRF.Crypto/BlazorPRF.Crypto.csproj -c Release -p:BlazorPRFVersion=${{ steps.version.outputs.VERSION }}

      - name: Verify Crypto package contents
        run: unzip -l .nuget/BlazorPRF.Crypto.${{ steps.version.outputs.VERSION }}.nupkg

      - name: Build Crypto.Testing
        run: dotnet build BlazorPRF.Crypto.Testing/BlazorPRF.Crypto.Testing.csproj -c Release -p:BlazorPRFVersion=${{ steps.version.outputs.VERSION }}

      - name: Build Wasm.Crypto
        run: dotnet build BaseCrypto/BlazorPRF.Wasm.Crypto/BlazorPRF.Wasm.Crypto.csproj -c Release -p:BlazorPRFVersion=${{ steps.version.outputs.VERSION }}

      - name: Build Server.Crypto
        run: dotnet build BaseCrypto/BlazorPRF.Server.Crypto/BlazorPRF.Server.Crypto.csproj -c Release -p:BlazorPRFVersion=${{ steps.version.outputs.VERSION }}

      - name: List local NuGet packages
        run: ls -la .nuget/

      - name: Clear all NuGet caches
        run: dotnet nuget locals all --clear

      # Build UI
      - name: Build UI
        run: dotnet build BlazorPRF.UI/BlazorPRF.UI.csproj -c Release -p:BlazorPRFVersion=${{ steps.version.outputs.VERSION }}

      - name: List all NuGet packages
        run: ls -la .nuget/

      # Build and test solution (without regenerating packages)
      - name: Build solution
        run: dotnet build BlazorPRF.slnx -c Release -p:GeneratePackageOnBuild=false -p:BlazorPRFVersion=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test BlazorPRF.slnx -c Release -p:GeneratePackageOnBuild=false -p:BlazorPRFVersion=${{ steps.version.outputs.VERSION }} --no-build --verbosity normal

      # Copy packages to ./nupkg for publishing
      - name: Copy packages
        run: |
          mkdir -p ./nupkg
          cp .nuget/*.nupkg ./nupkg/

      - name: List packages to publish
        run: ls -la ./nupkg/

      - name: Verify Crypto package before upload
        run: unzip -l ./nupkg/BlazorPRF.Crypto.${{ steps.version.outputs.VERSION }}.nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true
